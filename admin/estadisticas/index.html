<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/img/favicon-64.png" sizes="64x64" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Caveat:wght@600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/assets/css/panel.css">
<title>Estadísticas · Panel AUMÉ</title>
</head>
<body>
<div class="entorno" id="entorno" hidden></div>
<header class="cab">
  <div class="cont cab__in">
    <a class="cab__marca" href="/admin/">AUMÉ<span>panel</span></a>
    <nav class="cab__nav">
      <a class="cab__a" href="/admin/">Inicio</a>
      <a class="cab__a" href="/admin/menus/">Menú</a>
      <a class="cab__a" href="/admin/pedidos/">Pedidos</a>
      <a class="cab__a" href="/admin/precios/">Precios</a>
      <a class="cab__a" href="/admin/estadisticas/">Estadísticas</a>
      <a class="cab__a" href="/">Ver la web</a>
    </nav>
  </div>
</header>

<main class="cont hoja">
  <h1 class="titulo">Estadísticas</h1>
  <p class="bajada">Para decidir cuánto cocinar, qué reforzar y dónde crecer.</p>

  <div class="filtros">
    <button type="button" class="chip" id="r7" aria-pressed="false">7 días</button>
    <button type="button" class="chip" id="r28" aria-pressed="true">28 días</button>
    <button type="button" class="chip" id="r90" aria-pressed="false">3 meses</button>
    <label class="campo__l" for="fDesde">Desde</label>
    <input class="mes__sel" type="date" id="fDesde">
    <label class="campo__l" for="fHasta">Hasta</label>
    <input class="mes__sel" type="date" id="fHasta">
  </div>

  <div id="aviso"></div>
  <p class="cargando" id="cargando">Cargando el tablero…</p>

  <div id="tablero" hidden>
    <div class="kpis" id="kpis"></div>
    <div class="paneles" id="paneles"></div>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/admin/assets/js/panel.js"></script>
<script src="/admin/estadisticas/estadisticas.js"></script>
</body>
</html>
