<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/img/favicon-64.png" sizes="64x64" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Caveat:wght@600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/assets/css/panel.css">
<link rel="stylesheet" href="/admin/assets/css/shell.css">
<title>Menú · Panel AUMÉ</title>
</head>
<body>
<div class="entorno" id="entorno" hidden></div>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <nav class="sidebar-nav" aria-label="Secciones del panel">
      <a href="/admin/" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true" focusable="false"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9"/></svg>
        Inicio
      </a>
      <a href="/admin/menus/" class="nav-item active" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        Menú
      </a>
      <a href="/admin/pedidos/" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true" focusable="false"><path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        Pedidos
      </a>
      <a href="/admin/precios/" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true" focusable="false"><path d="M12 6v12M15 9.2c-.4-1-1.6-1.7-3-1.7-1.7 0-3 .9-3 2.2 0 3 6 1.6 6 4.6 0 1.3-1.3 2.2-3 2.2-1.4 0-2.6-.7-3-1.7"/></svg>
        Precios
      </a>
      <a href="/admin/estadisticas/" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true" focusable="false"><path d="M4 19V9m6.5 10V4m6.5 15v-7"/></svg>
        Estadísticas
      </a>
      <div class="nav-divider"></div>
      <a href="/" class="nav-item nav-external">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true" focusable="false"><path d="M14 4h6v6M20 4 10 14M19 13v6a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h6"/></svg>
        Ver la web
      </a>
    </nav>
  </aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="hamburgerBtn" aria-label="Abrir menú" data-tooltip="Abrir menú" aria-expanded="false" aria-controls="sidebar">
          <svg class="icon-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" focusable="false"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <div class="topbar-title">
          <h1 class="page-title">Menú</h1>
        </div>
      </div>
      <a class="topbar-brand" href="/admin/" aria-label="Ir al inicio del panel">
        <img src="/assets/img/logo.png" alt="AUMÉ" width="160" height="40">
      </a>
    </header>

    <main class="content">
  <p class="bajada">
    Cargá el menú de cada día. Queda como borrador hasta que le des
    publicar; recién ahí lo ve la clienta.
  </p>

  <p style="margin-bottom:18px">
    <a class="btn btn--pri" href="/admin/menus/semana.html">Cargar una semana completa</a>
  </p>

  <div id="aviso"></div>

  <div class="mes">
    <label class="campo__l" for="selMes">Mes</label>
    <select class="mes__sel" id="selMes"></select>
    <span class="guardar__n" id="resumenMes"></span>
  </div>

  <p class="cargando" id="cargando">Cargando…</p>
  <div class="dias" id="dias"></div>
    </main>
    <footer class="pagefoot">
      Panel interno de AUMÉ · Paraná, Entre Ríos
    </footer>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/admin/assets/js/panel.js"></script>
<script src="/admin/menus/menus.js"></script>
</body>
</html>
